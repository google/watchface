# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Continuous Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build_memory_footprint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: "17"
          distribution: "corretto"
          architecture: "x64"
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools build-tools;30.0.3"
      - name: Get project hash
        run: |
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          echo "git_hash=$git_hash" >> $GITHUB_ENV
      - name: Check format
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: play-validations
          arguments: spotlessCheck
      - name: Build memory-footprint.jar
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: play-validations
          arguments: memory-footprint:jar -Dmemory-footprint.git_hash=${{ env.git_hash }}
      - name: Test memory-footprint
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: play-validations
          arguments: memory-footprint:test
  build_validator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: "17"
          distribution: "corretto"
          architecture: "x64"
      - name: Build the validator
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: third_party/wff
          arguments: :specification:validator:build
  build_wff_optimizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: "17"
          distribution: "corretto"
          architecture: "x64"
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools build-tools;30.0.3"
      - name: Get project hash
        run: |
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          echo "git_hash=$git_hash" >> $GITHUB_ENV
      - name: Check format
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: tools
          arguments: spotlessCheck
      - name: Build wff-optimizer.jar
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: tools
          arguments: wff-optimizer:jar -Dmemory-footprint.git_hash=${{ env.git_hash }}
      - name: Test wff-optimizer
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          build-root-directory: tools
          arguments: wff-optimizer:test
